# The whole stack: MySQL, the Spring Boot API and the web frontend.
#   cp .env.example .env   # set APP_JWT_SECRET
#   docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: snipp
      MYSQL_USER: snipp
      MYSQL_PASSWORD: snipp
      MYSQL_ROOT_PASSWORD: snipp_root_password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "snipp", "-psnipp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/snipp
      SPRING_DATASOURCE_USERNAME: snipp
      SPRING_DATASOURCE_PASSWORD: snipp
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (at least 32 characters)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      APP_RATE_LIMIT_AUTH_PER_MINUTE: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:-10}

  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://app:8080

volumes:
  db-data:
